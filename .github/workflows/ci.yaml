name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

# Aucun droit par défaut : chaque job déclare uniquement ce dont il a besoin.
permissions: {}

env:
  IMAGE_NAME: ghcr.io/keil-enzo/devsecops-tp1-api
  CI_TAG: ci-${{ github.sha }}
  PYTHON_VERSION: "3.14"

jobs:
  lint-python:
    name: Lint Python (Flake8)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install flake8==7.4.1
      - run: flake8 --config .flake8 .

  lint-docker:
    name: Lint Dockerfile (Hadolint)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  build:
    name: Build & métrologie des couches (Dive)
    needs: [lint-python, lint-docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # export du cache de build vers GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Jeton écrit dans secrets/ (ignoré par Git et le contexte), monté en tmpfs par BuildKit.
      - name: Jeton du dépôt privé
        env:
          PIP_TOKEN: ${{ secrets.PIP_TOKEN }}
        run: |
          test -n "$PIP_TOKEN"
          install -d -m 700 secrets
          (umask 077 && printf '%s' "$PIP_TOKEN" > secrets/pip_token)
      - name: Build amd64 (bake ci)
        env:
          VERSION: ${{ env.CI_TAG }}
          REVISION: ${{ github.sha }}
          CI_OUTPUT: ${{ runner.temp }}/image.tar
        run: docker buildx bake --file docker-bake.hcl --allow=fs.write="${{ runner.temp }}" ci
      - name: Aucune trace du jeton dans l'historique et la config
        env:
          PIP_TOKEN: ${{ secrets.PIP_TOKEN }}
        run: |
          docker load -i "${{ runner.temp }}/image.tar"
          if { docker history --no-trunc "$IMAGE_NAME:$CI_TAG"; docker image inspect "$IMAGE_NAME:$CI_TAG"; } | grep -qF "$PIP_TOKEN"; then
            echo "::error::Jeton retrouvé dans les métadonnées de l'image"
            exit 1
          fi
      - name: Dive --ci (efficience >= 80 %)
        run: |
          docker run --rm -e CI=true \
            -v "${{ runner.temp }}/image.tar:/image.tar:ro" \
            wagoodman/dive:v0.13.1@sha256:f1886e6c32c094fc41a623c1989f5cb3e48aa766da5f0be233f911fc1d85ce10 \
            docker-archive:///image.tar \
            --lowestEfficiency=0.8 \
            --highestUserWastedPercent=0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  sbom:
    name: SBOM (CycloneDX + SPDX)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Generation statique des SBOM avec Syft
        run: |
          docker run --rm \
            -v "${{ runner.temp }}/image.tar:/input/image.tar:ro" \
            -v "$GITHUB_WORKSPACE:/output" \
            anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a \
            scan docker-archive:/input/image.tar \
            --source-name "$IMAGE_NAME" \
            --source-version "$CI_TAG" \
            -o cyclonedx-json=/output/sbom.cdx.json \
            -o spdx-json=/output/sbom.spdx.json
      - name: Validation des SBOM
        run: |
          test -s sbom.cdx.json
          test -s sbom.spdx.json
          python -m json.tool sbom.cdx.json >/dev/null
          python -m json.tool sbom.spdx.json >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  trivy:
    name: Vulnérabilités (Trivy)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Trivy image API
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy dépendances (requirements.txt)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  integration:
    name: Tests d'intégration (Compose)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      API_TAG: ci-${{ github.sha }}
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load -i "${{ runner.temp }}/image.tar"
      - name: Démarrage de la stack (attente des healthchecks)
        run: docker compose up -d --no-build --wait --wait-timeout 120
      - run: docker compose ps
      - name: Smoke tests HTTP
        run: |
          curl -fsS http://127.0.0.1:5000/health
          curl -fsS http://127.0.0.1:5000/dbtest
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt
      - name: Pytest
        env:
          DB_HOST: 127.0.0.1
        run: pytest -v
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs
      - name: Arrêt de la stack
        if: always()
        run: docker compose down -v

  release:
    name: Publication GHCR (multi-arch)
    needs: [sbom, trivy, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
      - name: Jeton du dépôt privé
        env:
          PIP_TOKEN: ${{ secrets.PIP_TOKEN }}
        run: |
          test -n "$PIP_TOKEN"
          install -d -m 700 secrets
          (umask 077 && printf '%s' "$PIP_TOKEN" > secrets/pip_token)
      # amd64 reprend le cache du job build : mêmes couches que l'image scannée et testée.
      - name: Build, push et récupération du digest immuable
        id: publish
        env:
          VERSION: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          export VERSION="${VERSION#v}"
          metadata="${RUNNER_TEMP}/build-metadata.json"
          docker buildx bake --file docker-bake.hcl --metadata-file "$metadata" release
          digest="$(jq -er '.release["containerimage.digest"] | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Vérification de l'index publié
        run: docker buildx imagetools inspect "${{ steps.publish.outputs.image }}"
      - name: Signature de l'image par digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -n "$COSIGN_PRIVATE_KEY"
          cosign sign --yes \
            --key env://COSIGN_PRIVATE_KEY \
            "${{ steps.publish.outputs.image }}"
      - name: Attestation CycloneDX signée
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -s "${RUNNER_TEMP}/sbom/sbom.cdx.json"
          cosign attest --yes \
            --key env://COSIGN_PRIVATE_KEY \
            --predicate "${RUNNER_TEMP}/sbom/sbom.cdx.json" \
            --type cyclonedx \
            "${{ steps.publish.outputs.image }}"

  admission:
    name: Gate d'admission (signature + attestation)
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validation du digest transmis
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          test "$IMAGE" = "$IMAGE_NAME@$DIGEST"
          printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
      - name: Vérification cryptographique de la signature
        env:
          IMAGE: ${{ needs.release.outputs.image }}
        run: cosign verify --key cosign.pub "$IMAGE"
      - name: Vérification de l'attestation CycloneDX
        env:
          IMAGE: ${{ needs.release.outputs.image }}
        run: cosign verify-attestation --key cosign.pub --type cyclonedx "$IMAGE"
